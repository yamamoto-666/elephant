services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elephant -d elephant"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  frontend: 
    build: ./frontend
    ports: 
      - "3000:3000"
    volumes:
      - ./frontend:/app
      -  /app/node_modules
    depends_on:
      - backend

volumes:
  db-data: